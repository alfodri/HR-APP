[package]
name = "hr-app"
version = "0.1.0"
description = "HR staff management desktop app"
authors = ["alfodri"]
edition = "2021"

[lib]
name = "hr_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hr-dev"
path = "src/bin/hr-dev.rs"
required-features = ["dev-server"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
calamine = "0.36"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", optional = true, features = ["multipart"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6", optional = true, features = ["cors"] }

[features]
default = []
dev-server = ["dep:axum", "dep:tokio", "dep:tower-http"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
